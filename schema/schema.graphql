schema {
  query: RootQueryType
  mutation: RootMutationType
}

"""JSON"""
scalar Json

"""Lists"""
scalar List

"""Localized JSON"""
scalar LocalizedJson

"""Localized map"""
scalar LocalizedMap

"""Localized string"""
scalar LocalizedString

"""Map / Dictionary"""
